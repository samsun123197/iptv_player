<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV PORT PLAYER v5.0 Ultimate</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0a0a12; --panel-bg: #121224; --card-bg: #1c1c3a;
            --text-color: #eee; --accent-color: #ffcc00; --accent-hover: #ff9900;
            --neon-shadow: rgba(255, 204, 0, 0.4);
        }
        body.light {
            --bg-color: #f0f2f5; --panel-bg: #ffffff; --card-bg: #e4e6eb;
            --text-color: #1c1e21; --accent-color: #0076ff; --accent-hover: #0056b3;
            --neon-shadow: rgba(0, 118, 255, 0.2);
        }
        body.blue {
            --bg-color: #001122; --panel-bg: #001f3f; --card-bg: #003366;
            --text-color: #ffffff; --accent-color: #00ffff; --accent-hover: #00cccc;
            --neon-shadow: rgba(0, 255, 255, 0.4);
        }
        body.green {
            --bg-color: #051405; --panel-bg: #0f3f0f; --card-bg: #1f5f1f;
            --text-color: #ffffff; --accent-color: #39ff14; --accent-hover: #28cc0f;
            --neon-shadow: rgba(57, 255, 20, 0.4);
        }
        body.purple {
            --bg-color: #100015; --panel-bg: #2f003f; --card-bg: #4f005f;
            --text-color: #ffffff; --accent-color: #df00ff; --accent-hover: #b800cc;
            --neon-shadow: rgba(223, 0, 255, 0.4);
        }

        body { 
            margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); color: var(--text-color); 
            transition: background 0.3s, color 0.3s; position:relative; overflow:hidden; height: 100vh;
        }

        #matrixContainer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:0; opacity: 0.1; }
        .matrixText { position:absolute; font-weight:bold; white-space:nowrap; user-select:none; transform: rotate(-15deg); font-family: monospace; }

        .container-wrapper { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 5px 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }

        .top-control-row { display: flex; justify-content: center; align-items: center; margin-bottom: 5px; }
        .link-parser-box { display: flex; gap: 5px; width: 100%; max-width: 500px; }

        .login-and-info-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }

        .iptv-info-vertical-bar {
            display: flex; flex-direction: column; background: var(--panel-bg); padding: 4px 10px; border-radius: 6px;
            border: 1px dashed var(--accent-color); font-size: 10px; gap: 1px; line-height: 1.2; min-width: 140px;
        }
        .iptv-info-vertical-bar div { display: flex; justify-content: space-between; gap: 8px; }
        .iptv-info-vertical-bar span { font-weight: bold; color: var(--accent-color); }
        .iptv-info-vertical-bar i { font-style: normal; color: #fff; }

        .input-row { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; align-items: center; }
        .input-row input, .input-row button, .input-row select, .link-parser-box input, .link-parser-box button { 
            padding: 6px 10px; font-size:12px; border-radius:6px; border:1px solid rgba(255,255,255,0.1);
            background: var(--panel-bg); color: var(--text-color); outline: none; box-sizing: border-box;
        }
        .input-row input { width:130px; }
        .link-parser-box input { width: 100%; }
        
        button { background: var(--accent-color); color: #000; cursor:pointer; font-weight:bold; transition:0.2s; border: none; }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .mode-row { display: flex; justify-content: center; gap: 10px; margin: 2px 0 5px 0; }
        .mode-btn { 
            padding: 6px 18px; font-size: 13px; font-weight: bold; border-radius: 20px; border: 2px solid var(--accent-color);
            background: transparent; color: var(--text-color); cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active, .mode-btn:hover {
            background: var(--accent-color); color: #000; box-shadow: 0 0 10px var(--neon-shadow);
        }

        #categoryButtons { 
            display:flex; gap:5px; margin: 2px 0 5px 0; overflow-x:auto; padding: 2px 0;
            scrollbar-width: thin; scrollbar-color: var(--accent-color) transparent;
        }
        #categoryButtons button { 
            padding: 5px 12px; border-radius:15px; border:none; font-size:11px; white-space: nowrap;
            background: var(--card-bg); color: var(--text-color); cursor:pointer; font-weight:600; transition:0.2s; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        #categoryButtons button:hover, #categoryButtons button.active { 
            background: var(--accent-color); color: #000; box-shadow: 0 0 5px var(--neon-shadow);
        }

        .main-container { display:flex; gap:10px; flex: 1; min-height: 0; margin-bottom: 5px; }
        
        .left-panel { 
            flex: 1; max-width: 360px; min-width: 280px; background: var(--panel-bg); 
            border-radius:10px; padding:8px; overflow-y:auto; display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05); gap: 8px;
        }

        .search-container { display: flex; gap: 5px; width: 100%; }
        .search-box { flex: 1; }
        .search-box input { width: 100%; padding: 8px; border-radius: 6px; border: none; background: var(--card-bg); color: var(--text-color); box-sizing: border-box; font-size: 13px; }
        .sort-select { padding: 8px; border-radius: 6px; background: var(--card-bg); color: var(--text-color); border: none; font-size: 12px; cursor: pointer; }

        #channelGrid { flex: 1; overflow-y: auto; }

        .series-nav-header { font-size: 12px; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; display: flex; gap: 5px; align-items: center; cursor: pointer; }
        .season-btn { width: 100%; text-align: left; padding: 6px; margin-bottom: 3px; background: var(--card-bg); border-radius: 4px; font-size: 12px; color: #fff; border: none; cursor: pointer; }
        .season-btn:hover { background: var(--accent-color); color: #000; }

        .right-panel { 
            flex:2; background: #000; border-radius:10px; overflow: hidden;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            border: 2px solid var(--accent-color); box-shadow: 0 0 10px var(--neon-shadow); position: relative;
        }

        .channel-card { 
            margin-bottom:5px; width:100%; cursor:pointer; display:flex; align-items:center; 
            background: var(--card-bg); border-radius:6px; overflow:hidden; transition:0.1s; box-sizing: border-box; padding-right: 5px;
        }
        .channel-card img { width:35px; height:45px; object-fit:cover; margin-right:10px; background: #000; }
        .channel-card h3 { font-size:12px; margin:0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-card:hover { background: var(--accent-color); color: #000; transform: scale(1.005); }

        .favorite-btn { background:transparent; color: var(--accent-color); border:none; font-size: 15px; cursor:pointer; padding: 4px; }
        .channel-card:hover .favorite-btn { color: #000; }

        .right-panel video { width:100%; height:100%; object-fit: contain; cursor: pointer; }
        
        .epg-info-bar { width: 100%; background: rgba(0,0,0,0.85); padding: 6px 12px; box-sizing: border-box; font-size: 12px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); display: none; }
        .epg-info-bar span { color: var(--accent-color); font-weight: bold; }

        .video-controls { position: absolute; bottom: 10px; display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(5px); align-items: center; z-index: 10; }
        .video-controls button, .video-controls select { background: var(--accent-color); color: #000; border: none; padding: 4px 10px; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 11px; }

        footer { text-align:center; font-size:11px; color:#555; padding: 2px 0; }

        @media(max-width:768px){
            body { overflow: auto; height: auto; }
            .container-wrapper { height: auto; }
            .main-container { flex-direction: column-reverse; height: auto; }
            .left-panel { max-width: 100%; height: auto; }
            .right-panel { height: 220px; }
            .input-row input { width: 100%; }
            .login-and-info-row { flex-direction: column-reverse; align-items: stretch; }
        }
    </style>
</head>
<body onload="App.init()">

<div class="container-wrapper">
    <div class="top-control-row">
        <div class="link-parser-box">
            <input type="text" id="m3uLink" placeholder="M3U Linkini Yapıştırın (Xtream Formatlı)">
            <button onclick="App.parseXtreamM3ULink()">🔗 Çözümle</button>
        </div>
    </div>
    
    <div class="login-and-info-row">
        <div class="iptv-info-vertical-bar" id="infoBox">
            <div><span>Başlangıç:</span> <i id="info-start">-</i></div>
            <div><span>Bitiş:</span> <i id="info-end">-</i></div>
            <div><span>Aktif/Max:</span> <i><b id="info-active">-</b> / <b id="info-max">-</b></i></div>
            <div><span>K/F/D:</span> <i><b id="info-live-count">-</b> / <b id="info-movie-count">-</b> / <b id="info-series-count">-</b></i></div>
        </div>

        <div class="input-row">
            <input type="text" id="server" placeholder="Sunucu Adresi">
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="App.initialize()">🚀 Giriş</button>
            
            <select id="profileSelect" onchange="App.loadProfile(this.value)">
                <option value="">👤 Kayıtlı Profiller</option>
            </select>

            <select onchange="App.changeTheme(this.value)">
                <option value="dark">🌑 Dark</option>
                <option value="light">🌗 Light</option>
                <option value="blue">🔵 Mavi</option>
                <option value="green">🟢 Yeşil</option>
                <option value="purple">🟣 Mor</option>
            </select>
            <button onclick="App.showFavorites()" style="background: #ff4545; color: white;">⭐</button>
        </div>
    </div>

    <div class="mode-row">
        <button id="mode-live" class="mode-btn active" onclick="App.switchMode('live')">📺 Canlı TV</button>
        <button id="mode-movies" class="mode-btn" onclick="App.switchMode('movies')">🎬 Filmler</button>
        <button id="mode-series" class="mode-btn" onclick="App.switchMode('series')">🍿 Diziler</button>
    </div>

    <div id="categoryButtons"></div>

    <div class="main-container">
        <div class="left-panel">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" oninput="App.filterChannels()" placeholder="🔍 Ara...">
                </div>
                <select id="sortSelect" class="sort-select" onchange="App.filterChannels()">
                    <option value="default">Varsayılan</option>
                    <option value="az">A-Z</option>
                </select>
            </div>
            
            <div id="channelGrid">
                <p style="text-align:center; color:#666; font-size:12px; margin-top:20px;">Giriş yapın.</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="epg-info-bar" id="epgBar">📺 Şu An Oynatılıyor: <span id="epgText">-</span></div>
            <video id="video" crossorigin="anonymous" controls autoplay></video>
            <div class="video-controls">
                <button onclick="App.rewind()">⏪ 10sn</button>
                <button onclick="App.forward()">⏩ 10sn</button>
                <select onchange="App.changeSpeed(this.value)">
                    <option value="1">1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>
        </div>
    </div>

    <footer>Cyber IPTV Player Panel v5.0 Master</footer>
</div>

<div id="matrixContainer"></div>

<script>
const App = {
    state: {
        server: '', username: '', password: '', currentMode: 'live',
        data: { live: [], movies: [], series: [] },
        filteredList: [], favorites: [], activeSubCategory: null, hlsInstance: null,
        profiles: [],
        defaultLogo: 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=100&auto=format&fit=crop'
    },

    el: {
        server: () => document.getElementById('server'),
        user: () => document.getElementById('username'),
        pass: () => document.getElementById('password'),
        m3u: () => document.getElementById('m3uLink'),
        search: () => document.getElementById('searchInput'),
        grid: () => document.getElementById('channelGrid'),
        categories: () => document.getElementById('categoryButtons'),
        video: () => document.getElementById('video'),
        matrix: () => document.getElementById('matrixContainer'),
        epg: () => document.getElementById('epgBar'),
        epgText: () => document.getElementById('epgText'),
        profiles: () => document.getElementById('profileSelect')
    },

    init() {
        this.loadProfiles();
        this.loadFavorites();
        this.createMatrixText();
        this.setupKeyboardControls();
        this.setupVideoDoubleClick();
        window.addEventListener('resize', () => this.createMatrixText());
    },

    loadProfiles() {
        try { this.state.profiles = JSON.parse(localStorage.getItem('iptv_profiles')) || []; } catch(e) { this.state.profiles = []; }
        const select = this.el.profiles();
        select.innerHTML = '<option value="">👤 Kayıtlı Profiller</option>';
        this.state.profiles.forEach((p, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = p.name || p.server;
            select.appendChild(opt);
        });
        if(this.state.profiles.length > 0) { setTimeout(() => this.loadProfile(0), 100); }
    },

    loadProfile(index) {
        if(index === "" || !this.state.profiles[index]) return;
        const p = this.state.profiles[index];
        this.el.server().value = p.server || '';
        this.el.user().value = p.username || '';
        this.el.pass().value = p.password || '';
        this.initialize();
    },

    saveProfile(server, username, password) {
        const exist = this.state.profiles.find(p => p.server === server && p.username === username);
        if(!exist) {
            let domain = "Sunucu";
            try { domain = new URL(server).hostname; } catch(e){}
            this.state.profiles.push({ name: domain, server, username, password });
            localStorage.setItem('iptv_profiles', JSON.stringify(this.state.profiles));
            this.loadProfiles();
        }
    },

    loadFavorites() { try { this.state.favorites = JSON.parse(localStorage.getItem('favorites')) || []; } catch(e) { this.state.favorites = []; } },

    toggleFavorite(item) {
        const id = item.stream_id || item.series_id;
        const modeOfItem = item.itemMode || this.state.currentMode;
        const favKey = `${modeOfItem}_${id}`;
        const index = this.state.favorites.findIndex(f => f.favKey === favKey);
        if (index === -1) { this.state.favorites.push({ ...item, favKey: favKey, itemMode: modeOfItem }); } 
        else { this.state.favorites.splice(index, 1); }
        localStorage.setItem('favorites', JSON.stringify(this.state.favorites));
        if(this.state.activeSubCategory === 'fav') { this.showFavorites(); } else { this.renderList(); }
    },

    showFavorites() {
        if (this.state.favorites.length === 0) return alert("Henüz favori eklemediniz!");
        this.state.filteredList = [...this.state.favorites];
        this.state.activeSubCategory = 'fav';
        this.updateActiveSubCategoryButton();
        this.renderList();
    },

    parseXtreamM3ULink() {
        const link = this.el.m3u().value.trim();
        try {
            const url = new URL(link);
            const serverUrl = `${url.protocol}//${url.host}`;
            const params = new URLSearchParams(url.search);
            const userParam = params.get('username');
            const passParam = params.get('password');
            if (!userParam || !passParam) throw new Error("M3U parametreleri eksik.");
            this.el.server().value = serverUrl;
            this.el.user().value = userParam;
            this.el.pass().value = passParam;
            this.initialize();
        } catch (err) { alert("Geçersiz link: " + err.message); }
    },

    initialize() {
        this.state.server = this.el.server().value.trim();
        this.state.username = this.el.user().value.trim();
        this.state.password = this.el.pass().value.trim();
        if (!this.state.server || !this.state.username || !this.state.password) return;
        this.saveProfile(this.state.server, this.state.username, this.state.password);
        this.loadAllData();
    },

    formatTimestamp(ts) {
        if (!ts || ts === "null" || ts === "0") return "Yok";
        return new Date(ts * 1000).toLocaleDateString('tr-TR');
    },

    getSecureProxyUrl(targetUrl) {
        if (window.location.hostname.includes('github.io') || window.location.protocol === 'https:') {
            // BURAYA KENDİ GERÇEK CLOUDFLARE WORKER LINKINI YAZMALISIN
            return `https://iptv-proxy.kocrdp.workers.dev/?url=${encodeURIComponent(targetUrl)}`;
        }
        return targetUrl; 
    },

    async loadAllData() {
        const grid = this.el.grid();
        grid.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px; font-size:12px;">Yükleniyor...</p>';
        const baseUrl = `${this.state.server}/player_api.php?username=${this.state.username}&password=${this.state.password}`;

        try {
            const [profileRes, liveRes, movieRes, seriesRes] = await Promise.all([
                fetch(this.getSecureProxyUrl(baseUrl)).then(r => r.json()).catch(() => null),
                fetch(this.getSecureProxyUrl(baseUrl + '&action=get_live_streams')).then(r => r.json()).catch(() => []),
                fetch(this.getSecureProxyUrl(baseUrl + '&action=get_vod_streams')).then(r => r.json()).catch(() => []),
                fetch(this.getSecureProxyUrl(baseUrl + '&action=get_series')).then(r => r.json()).catch(() => [])
            ]);

            this.state.data.live = Array.isArray(liveRes) ? liveRes : [];
            this.state.data.movies = Array.isArray(movieRes) ? movieRes : [];
            this.state.data.series = Array.isArray(seriesRes) ? seriesRes : [];

            if (profileRes && profileRes.user_info) {
                const u = profileRes.user_info;
                document.getElementById('info-start').textContent = this.formatTimestamp(u.created_at);
                document.getElementById('info-end').textContent = this.formatTimestamp(u.exp_date);
                document.getElementById('info-active').textContent = u.active_cons || "0";
                document.getElementById('info-max').textContent = u.max_connections || "1";
            }

            document.getElementById('info-live-count').textContent = this.state.data.live.length;
            document.getElementById('info-movie-count').textContent = this.state.data.movies.length;
            document.getElementById('info-series-count').textContent = this.state.data.series.length;

            this.switchMode(this.state.currentMode);
        } catch (err) { grid.innerHTML = '<p style="text-align:center; color:#ff4545; margin-top:20px; font-size:12px;">Hata oluştu.</p>'; }
    },

    switchMode(mode) {
        this.state.currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`mode-${mode}`).classList.add('active');
        this.el.epg().style.display = "none";
        this.populateSubCategories();
    },

    populateSubCategories() {
        const container = this.el.categories();
        container.innerHTML = '';
        const activeData = this.state.data[this.state.currentMode];
        const subCategories = [...new Set(activeData.map(item => item.category_name).filter(cat => cat && cat.toLowerCase() !== 'diğer'))];

        if(subCategories.length === 0) {
            this.state.filteredList = activeData;
            this.state.activeSubCategory = null;
            this.renderList();
            return;
        }

        subCategories.forEach((subCat, index) => {
            const btn = document.createElement('button');
            btn.id = `btn-subcat-${index}`;
            btn.textContent = subCat;
            btn.onclick = () => {
                this.state.filteredList = activeData.filter(item => item.category_name === subCat);
                this.state.activeSubCategory = index;
                this.updateActiveSubCategoryButton();
                this.renderList();
            };
            container.appendChild(btn);
        });

        this.state.filteredList = activeData.filter(item => item.category_name === subCategories[0]);
        this.state.activeSubCategory = 0;
        this.updateActiveSubCategoryButton();
        this.renderList();
    },

    updateActiveSubCategoryButton() {
        document.querySelectorAll('#categoryButtons button').forEach(b => b.classList.remove('active'));
        if (this.state.activeSubCategory !== null && this.state.activeSubCategory !== 'fav') {
            document.getElementById(`btn-subcat-${this.state.activeSubCategory}`)?.classList.add('active');
        }
    },

    renderList() {
        const grid = this.el.grid();
        grid.innerHTML = '';
        if (this.state.filteredList.length === 0) {
            grid.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px; font-size:12px;">İçerik yok.</p>';
            return;
        }

        const fragment = document.createDocumentFragment();
        this.state.filteredList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            const name = item.name || item.stream_name || item.series_name || "İsimsiz";
            const logoUrl = item.stream_icon || item.cover || item.series_cover || this.state.defaultLogo;
            const id = item.stream_id || item.series_id;
            const modeOfItem = item.itemMode || this.state.currentMode;

            card.innerHTML = `<img src="${logoUrl}" onerror="this.src='${this.state.defaultLogo}'" /><h3>${name}</h3>`;

            const favBtn = document.createElement('button');
            favBtn.className = 'favorite-btn';
            const currentFavKey = `${modeOfItem}_${id}`;
            favBtn.innerHTML = this.state.favorites.some(f => f.favKey === currentFavKey) ? '❤️' : '🤍';
            favBtn.onclick = (e) => { e.stopPropagation(); this.toggleFavorite(item); };

            card.appendChild(favBtn);
            card.onclick = () => { if(modeOfItem === 'series') { this.loadSeriesInfo(item); } else { this.playItem(item, modeOfItem); } };
            fragment.appendChild(card);
        });
        grid.appendChild(fragment);
    },

    filterChannels() {
        const query = this.el.search().value.toLowerCase();
        const activeData = this.state.activeSubCategory === 'fav' ? this.state.favorites : this.state.data[this.state.currentMode];
        let list = activeData.filter(item => {
            const name = (item.name || item.stream_name || item.series_name || '').toLowerCase();
            return name.includes(query);
        });
        if(document.getElementById('sortSelect').value === 'az') {
            list.sort((a,b) => {
                const nameA = (a.name || a.stream_name || a.series_name || '');
                const nameB = (b.name || b.stream_name || b.series_name || '');
                return nameA.localeCompare(nameB, 'tr');
            });
        }
        this.state.filteredList = list;
        this.renderList();
    },

    async loadSeriesInfo(seriesItem) {
        const grid = this.el.grid();
        grid.innerHTML = '<p style="text-align:center; color:#aaa; font-size:12px;">Bölümler yükleniyor...</p>';
        const url = `${this.state.server}/player_api.php?username=${this.state.username}&password=${this.state.password}&action=get_series_info&series_id=${seriesItem.series_id}`;
        
        try {
            const res = await fetch(this.getSecureProxyUrl(url)).then(r => r.json());
            if(!res || !res.episodes) throw new Error();
            grid.innerHTML = `<div class="series-nav-header" onclick="App.populateSubCategories()">⬅️ Geri Dön / ${seriesItem.name || seriesItem.series_name}</div>`;
            
            Object.keys(res.episodes).forEach(seasonNum => {
                const sBtn = document.createElement('button');
                sBtn.className = 'season-btn';
                sBtn.textContent = `🎬 Sezon ${seasonNum}`;
                sBtn.onclick = () => {
                    grid.innerHTML = `<div class="series-nav-header" id="backToSeasons">⬅️ Sezonlar / Sezon ${seasonNum}</div>`;
                    document.getElementById('backToSeasons').onclick = () => this.loadSeriesInfo(seriesItem);
                    
                    res.episodes[seasonNum].forEach(ep => {
                        const epCard = document.createElement('div');
                        epCard.className = 'channel-card';
                        epCard.innerHTML = `<h3>📺 Bölüm ${ep.episode_num}: ${ep.title}</h3>`;
                        epCard.onclick = () => this.playDirectUrl(`${this.state.server}/series/${this.state.username}/${this.state.password}/${ep.id}.${ep.container_extension || 'mp4'}`);
                        grid.appendChild(epCard);
                    });
                };
                grid.appendChild(sBtn);
            });
        } catch(e) { grid.innerHTML = '<p style="text-align:center; color:#ff4545; font-size:12px;">Bölüm verisi bulunamadı.</p>'; }
    },

    async playItem(item, mode) {
        const id = item.stream_id || item.series_id;
        let streamUrl = '';
        if (mode === 'live') {
            streamUrl = `${this.state.server}/live/${this.state.username}/${this.state.password}/${id}.m3u8`;
            this.loadEPG(id);
        } else if (mode === 'movies') {
            streamUrl = `${this.state.server}/movie/${this.state.username}/${this.state.password}/${id}.mp4`;
            this.el.epg().style.display = "none";
        }
        this.playDirectUrl(streamUrl);
    },

    playDirectUrl(url) {
        console.log("Oynatılan Orijinal URL:", url);
        url = this.getSecureProxyUrl(url);
        const video = this.el.video();
        
        if (this.state.hlsInstance) { 
            this.state.hlsInstance.destroy(); 
            this.state.hlsInstance = null; 
        }

        // HLS Oynatma Yapılandırması (Canlı Yayınlar)
        if (url.includes('.m3u8') || url.includes('%2Em3u8')) {
            if (Hls.isSupported()) {
                // Cloudflare Tüneline özel başlıkları (XHR) yönetebilmek için hls.js ayarları
                this.state.hlsInstance = new Hls({
                    maxMaxBufferLength: 20,
                    enableWorker: true,
                    lowLatencyMode: true,
                    // Video parçalarını (ts dosyalarını) çekerken de CORS korumasını bozmaması için:
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                this.state.hlsInstance.loadSource(url);
                this.state.hlsInstance.attachMedia(video);
                this.state.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => video.muted = true);
                });
                
                this.state.hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            this.state.hlsInstance.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            this.state.hlsInstance.recoverMediaError();
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari ve mobil tarayıcılar için doğrudan native oynatma
                video.src = url;
                video.play().catch(() => {});
            }
        } else {
            // Filmler ve Sabit Mp4 Dosyaları
            video.src = url;
            video.play().catch(() => {});
        }
    },

    async loadEPG(streamId) {
        const url = `${this.state.server}/player_api.php?username=${this.state.username}&password=${this.state.password}&action=get_short_epg&stream_id=${streamId}`;
        try {
            const res = await fetch(this.getSecureProxyUrl(url)).then(r => r.json());
            if(res && res.epg_listings && res.epg_listings.length > 0) {
                const nowPlaying = res.epg_listings[0].title;
                let decodedTitle = nowPlaying;
                try { if (res.epg_listings[0].title_decoded) { decodedTitle = atob(res.epg_listings[0].title_decoded); } } catch(b64err) { decodedTitle = nowPlaying; }
                this.el.epgText().textContent = decodedTitle;
                this.el.epg().style.display = "block";
            } else { this.el.epg().style.display = "none"; }
        } catch(e) { this.el.epg().style.display = "none"; }
    },

    setupKeyboardControls() {
        window.addEventListener('keydown', (e) => {
            const video = this.el.video();
            if(document.activeElement.tagName === 'INPUT') return;
            if(e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
            if(e.code === 'ArrowRight') { video.currentTime += 10; }
            if(e.code === 'ArrowLeft') { video.currentTime -= 10; }
            if(e.code === 'ArrowUp') { e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); }
            if(e.code === 'ArrowDown') { e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); }
        });
    },

    setupVideoDoubleClick() {
        this.el.video().addEventListener('dblclick', () => {
            const video = this.el.video();
            if (!document.fullscreenElement) { video.requestFullscreen().catch(() => {}); } else { document.exitFullscreen(); }
        });
    },

    rewind() { this.el.video().currentTime -= 10; },
    forward() { this.el.video().currentTime += 10; },
    changeSpeed(speed) { this.el.video().playbackRate = parseFloat(speed); },
    changeTheme(themeName) { document.body.className = themeName; },

    createMatrixText() {
        const container = this.el.matrix(); container.innerHTML = '';
        const opacityColors = ["rgba(255,204,0,0.01)", "rgba(255,204,0,0.03)"];
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 8; i++) {
            const span = document.createElement('span'); span.className = 'matrixText'; span.textContent = 'IPTV';
            span.style.top = Math.random() * window.innerHeight + 'px'; span.style.left = Math.random() * window.innerWidth + 'px';
            span.style.fontSize = (14 + Math.random() * 12) + 'px'; span.style.color = opacityColors[Math.floor(Math.random() * opacityColors.length)];
            fragment.appendChild(span);
            let currentTop = parseFloat(span.style.top);
            setInterval(() => { currentTop += 0.2; if (currentTop > window.innerHeight) currentTop = -30; span.style.top = currentTop + 'px'; }, 70);
        }
        container.appendChild(fragment);
    }
};
</script>
